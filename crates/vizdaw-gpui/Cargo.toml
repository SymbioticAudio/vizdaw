[package]
name = "vizdaw-gpui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
vizdaw-app = { path = "../vizdaw-app" }
core-control = { path = "../core-control" }
core-ffi = { path = "../core-ffi" }
serde_json = "1"
unicode-segmentation = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
# A window's native handle, for ui.screenshot (GPUI's own version).
raw-window-handle = "0.6"
# Pinned 2026-11-21 to zed main at this rev rather than crates.io gpui 0.2.2:
# 0.2.2 panics in X11 window_handle (unimplemented) and fails to build on Linux
# via xattr. See docs/superpowers/specs/2026-11-21-gpui-spike-report.md.
gpui = { git = "https://github.com/zed-industries/zed", rev = "f4fe0be1f8c7974db07e01c5cd05bee0cf4eb8d9" }
# `font-kit`: without it the macOS platform uses a no-op text system and
# draws no text at all (it only logs a warning).
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "f4fe0be1f8c7974db07e01c5cd05bee0cf4eb8d9", features = ["runtime_shaders", "font-kit", "x11", "wayland"] }

[target.'cfg(target_os = "linux")'.dependencies]
# ui.screenshot reads the window's pixels from the X server.
x11rb = "0.13"
# The file panels (file_panels/linux.rs): the portal file chooser, the
# version and runtime GPUI's Linux platform uses (async-io, no tokio), so
# one copy; `raw_handle` makes the window identifier from GPUI's handles.
ashpd = { version = "0.13", default-features = false, features = ["async-io", "file_chooser", "raw_handle"] }
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
# The file panels (file_panels/macos.rs): the versions GPUI's macOS
# platform already uses.
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSOpenPanel", "NSPanel", "NSResponder", "NSSavePanel", "NSWindow", "objc2-uniform-type-identifiers"] }
objc2-uniform-type-identifiers = { version = "0.3", default-features = false, features = ["std", "UTType"] }

[features]
# ui.screenshot on macOS: GPUI's `Window::render_to_image` exists at this
# pin only with its `test-support` feature, which adds test helpers and no
# behaviour to a real-platform build. scripts/make-gpui-app.sh and the
# Linux CI build turn it on.
screenshot = ["gpui/test-support", "gpui_platform/test-support"]

[dev-dependencies]
tempfile = "3"
vizdaw-app = { path = "../vizdaw-app", features = ["test-support"] }
gpui = { git = "https://github.com/zed-industries/zed", rev = "f4fe0be1f8c7974db07e01c5cd05bee0cf4eb8d9", features = ["test-support"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "f4fe0be1f8c7974db07e01c5cd05bee0cf4eb8d9", features = ["test-support"] }
