[package]
name = "core-io"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Debug hooks for tests (`ZipReader::debug_*`); never in a shipping build.
test-hooks = []

[dependencies]
cfb = "=0.16.0"
core-engine = { path = "../core-engine" }
core-media = { path = "../core-media" }
core-model = { path = "../core-model" }
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
im = { version = "15", features = ["serde"] }
quick-xml = { version = "0.42.0", default-features = false }
rawzip = "0.5.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = "1"

[dev-dependencies]
core-engine = { path = "../core-engine", features = ["fixtures"] }
core-io = { path = ".", features = ["test-hooks"] }
proptest = "1"
tempfile = "3"
