[package]
name = "test-plugins"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
# `cdylib` is the CLAP binary; `rlib` lets tests call `bundle()`.
crate-type = ["cdylib", "rlib"]

[dependencies]
clack-plugin = "0.2"
vst3 = "=0.3.0"
clack-extensions = { version = "0.2", features = ["clack-plugin", "audio-ports", "note-ports", "params", "state", "latency", "render", "timer", "posix-fd", "gui"] }

[target.'cfg(target_os = "linux")'.dependencies]
# The GUI kind's X11 editor (pure Rust connection, no libxcb).
x11rb = "0.13"

[dev-dependencies]
clack-host = "0.2"
