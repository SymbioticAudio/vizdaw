[package]
name = "core-host"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
core-model = { path = "../core-model" }
core-engine = { path = "../core-engine" }
rtrb = "0.4"
clack-host = "0.2"
clack-extensions = { version = "0.2", features = ["clack-host", "audio-ports", "note-ports", "params", "state", "latency", "gui", "tail", "log", "thread-check", "render", "timer", "posix-fd"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
vst3 = "=0.3.0"
crossbeam-queue = "0.3"
libloading = "0.8"

[dev-dependencies]
core-engine = { path = "../core-engine", features = ["fixtures"] }
# `tests/vst3_dawproject.rs`: a VST3 state through a DAWproject package.
core-io = { path = "../core-io" }
test-plugins = { path = "../test-plugins" }
tempfile = "3"

[target.'cfg(target_os = "linux")'.dev-dependencies]
# `tests/clap_gui_linux.rs`: the X window tree and the app's poll.
x11rb = "0.13"
libc = "0.2"
