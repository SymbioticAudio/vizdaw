name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: GPUI system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb1-dev libvulkan-dev libfontconfig-dev libfreetype-dev xvfb mesa-vulkan-drivers libgl1-mesa-dri
      - name: VST3 SDK sample build packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ninja-build libx11-dev libx11-xcb-dev libxcb-util-dev libxcb-cursor-dev libxcb-keysyms1-dev libxcb-xkb-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libcairo2-dev libfreetype6-dev libpango1.0-dev libwayland-dev wayland-protocols libglib2.0-dev
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (core-ffi lib, the shipping port transport)
        run: cargo clippy -p core-ffi --lib -- -D warnings
      - name: Clippy (rt-check build)
        run: cargo clippy -p vizdaw-play --all-targets --features rt-check -- -D warnings
      - name: Real-time allocation tests (rt-check)
        if: runner.os == 'macOS'
        run: cargo test -p core-engine --features rt-check --test rt_alloc --test rt_alloc_graph --test rt_alloc_record --test rt_alloc_gestures --test rt_alloc_bounce --test rt_alloc_input_fx --test rt_alloc_midi_strip --test rt_alloc_mpe --test rt_alloc_crossfade
      - name: Multi-Q (cached)
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: target/multiq/out
          key: multiq-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-multiq.sh') }}
      - name: Build Multi-Q
        if: runner.os == 'macOS'
        run: scripts/build-multiq.sh
      - name: VST3 SDK samples (cached)
        uses: actions/cache@v4
        with:
          path: target/vst3sdk/out
          key: vst3sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-vst3-samples.sh') }}
      - name: Build the VST3 SDK samples
        run: scripts/build-vst3-samples.sh
      - name: Test
        run: cargo test --workspace
        env:
          # The VST3 host tests load the SDK samples; here a missing one is
          # a failure, not a skip.
          VIZDAW_REQUIRE_VST3_SAMPLES: "1"
      - name: CLAP X11 editors (Linux, virtual X server)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          unset WAYLAND_DISPLAY
          xvfb-run -a -s "-screen 0 1280x800x24" cargo test -p core-host --test clap_gui_linux -- --nocapture
          xvfb-run -a -s "-screen 0 1280x800x24" cargo test -p core-ffi --test editors_main
      - name: GPUI end to end (Linux, virtual X server)
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: |
          cargo build -p vizdaw-gpui --features screenshot
          unset WAYLAND_DISPLAY
          xvfb-run -a -s "-screen 0 1280x800x24" cargo test -p vizctl --test e2e_gpui -- --ignored --nocapture --test-threads 1
        env:
          VIZDAW_E2E_APP: target/debug/vizdaw-gpui
      - name: Bundled Multi-Q tests
        if: runner.os == 'macOS'
        run: |
          VIZDAW_BUNDLED_PLUGINS=$PWD/target/multiq/out cargo test -p core-host --test multiq -- --ignored
          VIZDAW_BUNDLED_PLUGINS=$PWD/target/multiq/out cargo test -p core-ffi --test new_channel_eq -- --ignored
          VIZDAW_BUNDLED_PLUGINS=$PWD/target/multiq/out cargo test -p core-ffi --test multiq_render -- --ignored
          VIZDAW_BUNDLED_PLUGINS=$PWD/target/multiq/out cargo test -p platform-macos --test multiq_au -- --ignored
      - name: Big lane read speed (release, spec 4a §3.1)
        if: runner.os == 'macOS'
        run: cargo test --release -p core-ffi --test events lane_events_of_100_000_events_is_fast
      - name: Device test (macOS runners have a null output device)
        if: runner.os == 'macOS'
        run: cargo test -p platform-macos --test hal -- --ignored || echo "no output device on this runner"
      - name: Offline render matches the fixture
        run: |
          cargo run -p vizdaw-play -- fixtures/demo.vizdaw --seq Song --offline "$RUNNER_TEMP/demo.txt"
          diff fixtures/demo.offline.txt "$RUNNER_TEMP/demo.txt"
      - name: Benchmarks compile
        run: cargo bench --workspace --no-run

  app:
    name: app (macOS)
    runs-on: macos-15
    env:
      VIZDAW_AUDIO: offline
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Multi-Q (cached)
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: target/multiq/out
          key: multiq-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-multiq.sh') }}
      - name: Build Multi-Q
        if: runner.os == 'macOS'
        run: scripts/build-multiq.sh
      - name: FFI tests
        run: cargo test -p core-ffi
      - name: Build the FFI library and Swift bindings
        run: scripts/build-ffi.sh
      - name: Swift build
        run: scripts/swift.sh build
      - name: Third-party notices build offline
        run: |
          cargo fetch --locked
          CARGO_NET_OFFLINE=true scripts/third-party-notices.sh target/third-party/THIRD-PARTY.txt
          grep -q '^quick-xml ' target/third-party/THIRD-PARTY.txt
          grep -q '^cfb ' target/third-party/THIRD-PARTY.txt
          grep -q '^vst3 ' target/third-party/THIRD-PARTY.txt
          grep -q '^VST 3 SDK 3.8.0 ' target/third-party/THIRD-PARTY.txt
      - name: App builds without the branded glyphs
        run: |
          VIZDAW_NO_BRAND=1 scripts/swift.sh build --scratch-path "$RUNNER_TEMP/nobrand"
          if [ -n "$(find "$RUNNER_TEMP/nobrand" \( -name 'SymbioticBrand*.o' -o -name 'SymbioticBrand*.swiftmodule' \))" ]; then
            echo "the no-brand build has SymbioticBrand in it" >&2
            exit 1
          fi
      - name: Swift tests
        run: scripts/swift.sh test
      - name: App bundle
        run: scripts/make-app.sh
      - name: End to end through the control channel (needs the runner's window server)
        timeout-minutes: 20
        run: cargo test -p vizctl --test e2e -- --ignored --nocapture --test-threads 1
        env:
          VIZDAW_E2E_APP: dist/VizDAW.app
