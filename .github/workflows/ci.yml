name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (core-ffi lib, the shipping port transport)
        run: cargo clippy -p core-ffi --lib -- -D warnings
      - name: Clippy (rt-check build)
        run: cargo clippy -p vizdaw-play --all-targets --features rt-check -- -D warnings
      - name: Real-time allocation tests (rt-check)
        if: runner.os == 'macOS'
        run: cargo test -p core-engine --features rt-check --test rt_alloc --test rt_alloc_graph --test rt_alloc_record --test rt_alloc_gestures --test rt_alloc_bounce --test rt_alloc_input_fx --test rt_alloc_midi_strip
      - name: Test
        run: cargo test --workspace
      - name: Big lane read speed (release, spec 4a §3.1)
        if: runner.os == 'macOS'
        run: cargo test --release -p core-ffi --test events lane_events_of_100_000_events_is_fast
      - name: Device test (macOS runners have a null output device)
        if: runner.os == 'macOS'
        run: cargo test -p platform-macos --test hal -- --ignored || echo "no output device on this runner"
      - name: Offline render matches the fixture
        run: |
          cargo run -p vizdaw-play -- fixtures/demo.vizdaw --seq Song --offline "$RUNNER_TEMP/demo.txt"
          diff fixtures/demo.offline.txt "$RUNNER_TEMP/demo.txt"
      - name: Benchmarks compile
        run: cargo bench --workspace --no-run

  app:
    name: app (macOS)
    runs-on: macos-15
    env:
      VIZDAW_AUDIO: offline
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: FFI tests
        run: cargo test -p core-ffi
      - name: Build the FFI library and Swift bindings
        run: scripts/build-ffi.sh
      - name: Swift build
        run: scripts/swift.sh build
      - name: App builds without the branded glyphs
        run: |
          VIZDAW_NO_BRAND=1 scripts/swift.sh build --scratch-path "$RUNNER_TEMP/nobrand"
          if [ -n "$(find "$RUNNER_TEMP/nobrand" \( -name 'SymbioticBrand*.o' -o -name 'SymbioticBrand*.swiftmodule' \))" ]; then
            echo "the no-brand build has SymbioticBrand in it" >&2
            exit 1
          fi
      - name: Swift tests
        run: scripts/swift.sh test
      - name: App bundle
        run: scripts/make-app.sh
      - name: End to end through the control channel (needs the runner's window server)
        timeout-minutes: 20
        run: cargo test -p vizctl --test e2e -- --ignored --nocapture --test-threads 1
        env:
          VIZDAW_E2E_APP: dist/VizDAW.app
